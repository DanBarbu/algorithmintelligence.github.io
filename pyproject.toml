[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metoc-lagrangian"
version = "0.1.0"
description = "NATO-compliant Lagrangian drift & energy-security forecasting platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["oceanography", "weather", "NATO", "drift", "energy"]
dependencies = [
    # ── Core (always required) ───────────────────────────────────────────────
    # Data validation / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.1",
    # NATO XML
    "lxml>=5.2",
]

[project.optional-dependencies]
# ── Lightweight scientific stack (used in CI) ─────────────────────────────
ci = [
    # Gridded data I/O
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    # Geometry
    "shapely>=2.0",
    "pyproj>=3.6",
    # HTTP / async
    "httpx>=0.27",
    "watchfiles>=0.22",
    # REST API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Visualisation
    "matplotlib>=3.9",
]

# ── Heavy optional deps (live operation, not required for tests) ──────────
full = [
    "metoc-lagrangian[ci]",
    # ECMWF Open Data
    "ecmwf-opendata>=1.2",
    # Copernicus Marine (CMEMS)
    "copernicusmarine>=1.3",
    # Lagrangian particle tracking
    "opendrift>=1.11",
    # GRIB2 decoding
    "cfgrib>=0.9.12",
    # Deep learning (WESF price model)
    "torch>=2.3",
    "darts>=0.30",
    "scikit-learn>=1.5",
    # Visualisation extras
    "folium>=0.17",
]

# ── Development / testing toolchain ──────────────────────────────────────
dev = [
    "metoc-lagrangian[ci]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-lxml",
]

[project.scripts]
metoc-pipeline = "src.core.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/api/main.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false  # optional deps may/may not be installed in CI

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
